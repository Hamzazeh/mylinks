<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my links</title>
    <link rel="stylesheet" href="pro24.css" />
    <link rel="shortcut icon" href="img/spiderman.jpg" type="image/x-icon">
  </head>
  <body>
    <!-- container -->
    <div class="container">
      <!-- section1 -->
      <section class="section1">
        <img
          class="profile-picture"
          src="img/spiderman.jpg"
          width="100"
          alt=""
        />
        <h2>@hamza_19</h2>
        <img class="menu" src="img/more.png" width="20px" alt="" />
      </section>
      <!-- end of section1 -->

      <!-- section2 -->
      <section class="section2">
        <!-- link -->
        <!-- <a href="https://www.google.com"> -->
        <div class="link">
          <img class="social-icon" src="img/twitter.png" alt="" />
          <p>Twitter</p>
          <img
            onclick="show()"
            class="more-icon"
            src="img/more.png"
            width="20px"
            alt=""
          />
          <p class="text-hover">it is me</p>
        </div>
        <!-- </a> -->
        <!-- end of link -->

        <!-- link -->
        <div class="link">
          <img class="social-icon" src="img/youtube.png" alt="" />
          <p>Youtube</p>
          <img class="more-icon" src="img/more.png" width="20px" alt="" />
        </div>
        <!-- end of link -->

        <!-- link -->
        <div class="link">
          <img class="social-icon" src="img/tiktok.png" alt="" />
          <p>Tiktok</p>
          <img class="more-icon" src="img/more.png" width="20px" alt="" />
        </div>
        <!-- end of link -->

        <!-- link -->
        <div class="link">
          <img class="social-icon" src="img/social.png" alt="" />
          <p>Instagram</p>
          <img class="more-icon" src="img/more.png" width="20px" alt="" />
        </div>
        <!-- end of link -->

        <!-- link -->
        <div class="link">
          <img class="social-icon" src="img/telegram.png" alt="" />
          <p>Telegram</p>
          <img class="more-icon" src="img/more.png" width="20px" alt="" />
        </div>
        <!-- end of link -->
      </section>
      <!-- end of section2 -->

      <!-- footer -->
      <footer class="footer">
        <p>Created by Hamza</p>
      </footer>
      <!-- end of footer -->
    </div>
    <!-- end of container -->


    <!-- script -->
    <script src="pro24.js"></script>
  </body>
</html>
